<div id="full" class="app">
  <header class="drag">
    <svg class="logo" viewBox="0 0 236 64" role="img" aria-label="CocoaTune"><use href="#logo"/></svg>
    <span class="sp"></span>
    <button id="cloudChip" class="chip" title="Cloud library"><svg><use href="#i-cloud"/></svg><span></span></button>
    <button id="pin" class="ib" title="Display on top"><svg><use href="#i-pin"/></svg></button>
    <button id="toMini" class="ib" title="Shrink to mini bar"><svg><use href="#i-bar"/></svg></button>
    <button id="menu" class="ib" title="Menu"><svg><use href="#i-menu"/></svg></button>
    <button id="minimize" class="ib" title="Minimize"><svg><use href="#i-min"/></svg></button>
    <button id="close" class="ib" title="Close"><svg><use href="#i-close"/></svg></button>
  </header>

  <form id="linkForm" class="bar">
    <input id="link" class="in" placeholder="Paste a link to save…" autocomplete="off" spellcheck="false">
    <button class="b r" type="submit">Save</button>
    <button id="addFiles" class="b g" type="button">+ Files</button>
  </form>

  <nav class="tabs">
    <div id="tabList" class="tabList"></div>
    <label class="search"><svg><use href="#i-search"/></svg><input id="q" placeholder="Search" spellcheck="false"></label>
  </nav>

  <div id="list" class="list"></div>
  <section id="settings" class="settings">
    <div class="sHead"><button id="sBack" class="ib" title="Back"><svg><use href="#i-back"/></svg></button><b>Settings</b></div>
    <div class="sBody">
      <h4>Cloud library</h4>
      <div id="cloudSet"></div>
      <h4>Theme</h4>
      <div id="presets" class="presets"></div>
      <h4>Colors</h4>
      <label class="sRow"><span>Accent</span><input type="color" data-key="accent"></label>
      <label class="sRow"><span>Background</span><input type="color" data-key="bg"></label>
      <label class="sRow"><span>Text</span><input type="color" data-key="text"></label>
      <button id="sReset" class="b g">Reset colors</button>
      <div class="winOnly">
        <h4>Shortcuts</h4>
        <button id="sShortcut" class="b g">Create desktop and Start menu shortcuts</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <div id="upPill" class="pill"><span id="upText"></span><div class="pb2"><i id="upFill"></i></div><small id="upPct"></small></div>

  <footer class="pl">
    <div class="now"><b id="nowTitle">Nothing playing</b><span id="nowTime">0:00 / 0:00</span></div>
    <div id="prog" class="prog"><i id="progFill"></i></div>
    <div class="ctl">
      <button id="shuffle" class="cb m" title="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button id="prev" class="cb" title="Previous"><svg><use href="#i-prev"/></svg></button>
      <button id="play" class="pb" title="Play"><svg><use href="#i-play"/></svg></button>
      <button id="next" class="cb" title="Next"><svg><use href="#i-next"/></svg></button>
      <button id="repeat" class="cb m" title="Repeat"><svg><use href="#i-repeat"/></svg><em>1</em></button>
      <button id="vol" class="cb vb" title="Volume"><svg><use href="#i-vol"/></svg></button>
      <div id="vpop" class="vpop"><div id="vtr" class="vtr"><i id="vfill"></i><b id="vknob"></b></div><small id="vval"></small></div>
    </div>
  </footer>
</div>

<div id="mini" class="mini drag">
  <svg class="mark" viewBox="0 0 64 64"><use href="#mark"/></svg>
  <div class="mt"><b id="miniTitle">Nothing playing</b><small id="miniTime">0:00 / 0:00</small></div>
  <button id="mPrev" class="ib" title="Previous"><svg><use href="#i-prev"/></svg></button>
  <button id="mPlay" class="pbs" title="Play"><svg><use href="#i-play"/></svg></button>
  <button id="mNext" class="ib" title="Next"><svg><use href="#i-next"/></svg></button>
  <button id="expand" class="ib" title="Expand"><svg><use href="#i-expand"/></svg></button>
  <div class="p2"><i id="miniFill"></i></div>
</div>


<div id="cloudDlg" class="dlg">
  <div class="dbox">
    <h3 id="cdTitle"></h3>
    <div id="cdTabs" class="dtabs"></div>
    <div id="cdPath" class="path"></div>
    <div id="cdMsg" class="dmsg"></div>
    <div id="cdList" class="fl"></div>
    <div class="dfoot"><span id="cdInfo"></span><button id="cdCancel" class="b g">Cancel</button><button id="cdOk" class="b r"></button></div>
  </div>
</div>

<div id="welcome" class="modal">
  <div class="card">
    <svg class="cardMark" viewBox="0 0 64 64"><use href="#mark"/></svg>
    <b>Welcome to CocoaTune</b>
    <p>Create a shortcut so CocoaTune is easy to open later.</p>
    <label class="chk"><input type="checkbox" id="wDesktop" checked> Desktop</label>
    <label class="chk"><input type="checkbox" id="wStart" checked> Start menu</label>
    <div class="cardBtns"><button id="wSkip" class="b g">Not now</button><button id="wCreate" class="b r">Create shortcut</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
